[pytest]
# Pytest configuration for A2A testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
    --cov=src/agentic_app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --maxfail=5

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    e2e: End-to-end workflow tests
    slow: Slow-running tests
    requires_redis: Tests that require Redis connection
    requires_db: Tests that require database connection
    requires_nim: Tests that require NVIDIA NIM API

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src/agentic_app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

