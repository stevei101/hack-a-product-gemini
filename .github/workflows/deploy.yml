name: Deploy to GCP

on:
  push:
    branches: [ switch-to-google ]
  pull_request:
    branches: [ switch-to-google ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: 'us-central1'
  GAR_LOCATION: ${{ secrets.GCP_REGION }}-docker.pkg.dev
  PROJECT_NAME: product-mindset

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install frontend dependencies
      run: bun install
      
    - name: Build frontend
      run: bun run build
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Setup backend environment
      run: |
        cd backend
        python -m venv .venv
        source .venv/bin/activate
        pip install uv
        uv pip install fastapi uvicorn sqlalchemy asyncpg httpx pydantic pydantic-settings numpy pytest
        
    - name: Run backend tests
      run: |
        cd backend
        source .venv/bin/activate
        python -m pytest -v
      env:
        NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  deploy-infra-and-app:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/switch-to-google' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.0'

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform
      env:
        TF_VAR_gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        TF_VAR_github_organization: ${{ github.repository_owner }}
        TF_VAR_github_repository: ${{ github.event.repository.name }}
        TF_VAR_environment: 'dev' # Hardcoded for this branch

    - name: Login to Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}

    - name: Build and push frontend image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/frontend:${{ github.sha }} .
        docker push ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/frontend:${{ github.sha }}

    - name: Build and push backend image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/backend:${{ github.sha }} ./backend
        docker push ${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/backend:${{ github.sha }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
        
    - name: Configure kubectl for GKE
      run: gcloud container clusters get-credentials primary-cluster --region ${{ env.GCP_REGION }}

    - name: Deploy with Helm
      run: |
        helm upgrade --install frontend ./charts/frontend \
          --namespace dev \
          --create-namespace \
          --set image.repository=${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/frontend \
          --set image.tag=${{ github.sha }}
          
        helm upgrade --install backend ./charts/backend \
          --namespace dev \
          --create-namespace \
          --set image.repository=${{ env.GAR_LOCATION }}/${{ env.GCP_PROJECT_ID }}/app-images/backend \
          --set image.tag=${{ github.sha }} \
          --set env.NIM_API_KEY='${{ secrets.NIM_API_KEY }}' \
          --set env.NIM_BASE_URL='${{ secrets.NIM_BASE_URL }}' \
          --set env.NIM_MODEL='${{ secrets.NIM_MODEL }}' \
          --set env.POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'

  deploy-static-site:
    name: Deploy Static Site to GCS
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/switch-to-google' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Deploy to GCS
      run: gsutil rsync -d -r dist/ gs://${{ env.GCP_PROJECT_ID }}-frontend-bucket